<h2>What is ORBIT?</h2><div class="card"><p>ORBIT is a planner built for students and self-directed learners. Instead of a flat to-do list, it connects your tasks, fixed commitments, goals and routines into one day that fits the hours you actually have, and it is honest when something does not fit.</p><p class="mu">Passing time never marks a task complete, and nothing is moved or deleted unless you choose it.</p></div>
<h2>How it works</h2><div class="steps">${step(1,'Tell ORBIT what matters','Add tasks, fixed events, deadlines and recurring routines. Nothing is added for you.')}${step(2,'Get a realistic timetable','Tasks are placed around your fixed events inside your available hours. Anything that does not fit is listed, never dropped.')}${step(3,'Focus','Run a timer on one task. Tracked time is logged separately and never auto-completes the task.')}${step(4,'Track what really happened','Mark tasks done, partial or skipped. Progress and analytics come only from your real records.')}${step(5,'Review and recover','End the day with a short review. Unfinished work goes to a backlog with clear next steps, not guilt.')}</div>

<div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<small>${d}</small>`).join('')}${[...Array(fw)].map(()=>'<div></div>').join('')}${[...Array(n)].map((_,i)=>{const d=`${calM}-${String(i+1).padStart(2,'0')}`,s=dayStats(d);return`<div class="cd ${d===td?'t':''}" data-a="cday" data-id="${d}">${i+1}${s.p?`<br><small>${s.done}/${s.p}</small>`:''}</div>`}).join('')}</div><p class="mu">Click a date to see its saved plan, completions and moves. Each date keeps its own history.</p>`},
set(){return`<h2>Settings</h2><div class="card"><div class="grid"><label>Default wake-up<input type="time" data-s="set.wake" value="${S.set.wake}"></label><label>Default sleep<input type="time" data-s="set.sleep" value="${S.set.sleep}"></label><label>Break after tasks (min)<input type="number" min="0" data-s="set.brk" value="${S.set.brk}"></label><label>Celebration animations<select data-s="set.anim"><option value="on" ${S.set.anim!=='off'?'selected':''}>On</option><option value="off" ${S.set.anim==='off'?'selected':''}>Off</option></select></label></div><div class="bar" style="margin-top:10px"><button class="b2" data-a="theme">Theme: ${S.set.theme} (tap to change)</button></div></div>
<div class="card"><h3>Profile & region</h3><div class="grid"><label>Name<input data-s="prof.name" value="${esc(S.prof.name)}"></label><label>Timezone (default: your device)<input list="tzl" data-s="set.tz" value="${esc(TZ)}"></label></div><datalist id="tzl">${(()=>{try{return Intl.supportedValuesOf('timeZone').map(z=>`<option value="${z}">`).join('')}catch(e){return''}})()}</datalist></div><div class="card"><h3>Categories</h3>${S.cats.map(c=>`<div class="row" style="--cc:${c.c}"><div class="g"><b>${c.i} ${esc(c.n)}</b></div><button class="sm" data-a="cedit" data-id="${c.id}">Edit</button><button class="sm" data-a="cdel" data-id="${c.id}">Delete</button></div>`).join('')}<div class="bar"><button class="b2" data-a="cadd">+ Add category</button></div><small>Categories that still have tasks can't be deleted, so nothing is lost silently. Hide/archive and reordering aren't built yet.</small></div><div class="card"><h3>About</h3><p class="mu">ORBIT v${CFG.ver} · built by ${esc(CFG.dev)}</p><div class="bar"><button class="b2" data-a="explore">About ORBIT</button><button class="b2" data-a="help">Keyboard shortcuts</button></div></div><div class="card"><h3>Storage health</h3><div class="dl"><span>Browser storage (primary)</span><b>${storeOK?'✓ Working':'✗ Unavailable'}</b></div><div class="dl"><span>Second copy (IndexedDB)</span><b>${idbOK===true?'✓ Working':idbOK===false?'✗ Unavailable':'Not checked yet'}</b></div><div class="dl"><span>Last saved</span><b>${S.ts?new Date(S.ts).toLocaleString('en-GB',{timeZone:TZ}):'Never'}</b></div><div class="dl"><span>Data size</span><b>${(JSON.stringify(S).length/1024).toFixed(1)} KB</b></div><div class="dl"><span>Last export</span><b>${S.lastExp?new Date(S.lastExp).toLocaleDateString('en-GB'):'Never'}</b></div>${storeOK?'':bdg('red','Your browser is blocking storage for this page (private mode or a restricted preview). Open ORBIT in a normal browser tab, or export backups often.')}<small>ORBIT keeps a primary copy, a rolling automatic backup and a second copy in IndexedDB, all on this device. Export JSON for a copy you control.</small></div><div class="card"><h3>Data & backup</h3><p class="mu">${storeOK?'Your data is saved automatically in this browser on this device only. It is not synced to the cloud, so export a backup regularly.':'⚠ Browser storage is unavailable here: nothing will persist after a refresh. Copy an export to keep your data.'}</p><div class="bar"><button class="b2" data-a="exp">Export JSON</button><button class="b2" data-a="imp">Import JSON</button><button class="b2" data-a="csv">Export CSV</button><button class="b2" data-a="clr" style="color:var(--red)">Clear all data</button></div></div>`}};
function render(){document.documentElement.dataset.theme=S.set.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.set.theme;syncCats();if(S.prof.done)genRec();if(!S.prof.done&&page!=='explore')page='onb';else if(S.prof.done&&page==='onb')page='dash';document.body.classList.toggle('onb',page==='explore'||page==='onb');document.body.classList.toggle('ex',page==='explore');const bl=S.tasks.filter(isBL).length;$('#nav').innerHTML='<h1>ORBIT</h1>'+[['dash','Dashboard','🏠'],['plan','Plan Today','📝'],['tt','Timetable','🗓'],['cls','Classes','🎓'],['bl','Backlog','⚠️'],['focus','Focus','⏱'],['goals','Goals','🎯'],['stats','Analytics','📊'],['review','Review','🌙'],['cal','Calendar','📅'],['set','Settings','⚙️']].map(([k,n,i])=>`<button class="nv ${page===k?'on':''}" data-a="go" data-id="${k}"><i>${i}</i>${n}${k==='bl'&&bl?`<span class="bd">${bl}</span>`:''}</button>`).join('');
$('#nav').insertAdjacentHTML('beforeend',`<div class="uc"><div class="av">${esc((S.prof.name||'You')[0].toUpperCase())}</div><div><b>${esc(S.prof.name||'You')}</b><br><small>🔥 ${streak()} day streak</small></div></div>`);const y=scrollY;$('#app').innerHTML=P[page]();scrollTo(0,y);clock()}
function clock(){const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('en-IN',{timeZone:TZ})}
setInterval(()=>{if(page==='focus'&&S.timer){const z=tstate();if(z.fin&&!S.timer.logged){tfin();render();return}const e=$('#ftime');if(e)e.textContent=fmt(z.left)}clock();if(new Date().getSeconds()<1&&!document.querySelector('.mod')&&['dash','tt'].includes(page))render()},1000);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey||document.querySelector('.mod')||!S.prof.done)return;if(e.key==='n'||e.key==='N'){e.preventDefault();A.add()}else if(e.key==='?'){kb()}});
addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.querySelector('.mod');if(m)m.remove()}});
addEventListener('hashchange',()=>{page=location.hash==='#about'?'explore':(S.prof.done?'dash':'onb');render()});
addEventListener('error',()=>{if(document.querySelector('#errb'))return;const b=document.createElement('div');b.id='errb';b.setAttribute('role','alert');b.textContent='Something went wrong. Your saved data is untouched. Reload the page, and export a backup from Settings if it keeps happening.';b.onclick=()=>b.remove();document.body.appendChild(b)});
if(location.hash==='#about')page='explore';
render();recover();
</script></body></html>
